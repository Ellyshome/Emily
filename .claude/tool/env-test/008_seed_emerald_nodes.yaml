# ============================================================
# 008_seed_emerald_nodes.yaml —— 全景节点树定义（EMERALD-01 翡翠湾项目）
#
# 用法：
#   uv run python scripts/manage_nodes.py create --file .claude/tool/env-test/008_seed_emerald_nodes.yaml --dry-run
#   uv run python scripts/manage_nodes.py create --file .claude/tool/env-test/008_seed_emerald_nodes.yaml
#
# 说明：
#   - node_id 为业务编号，统一前缀 EMR（EMERALD 缩写）
#   - stage_id: 0=立项 1=规划设计 2=工程施工 3=交付结算
#   - node_type: MILESTONE / WORK_PACKAGE / TASK
#   - owner_dept_id 用中文部门名（现状口径）；related_company_id 可写中文单位名称/类型，
#     入口由 CompanyResolver 解析为 company_info.id 落库，并自动登记为该节点的参与单位
#   - children 嵌套自动展平并设 parent_node_id
#   - deliverables 为节点需产出的成果清单
#   - dependencies 为前置依赖（按 deliverable_name 模糊匹配）
#   - status 字段不在 YAML 中指定，已完成节点的 deliverables 中 current_amount = target_amount 即可体现完成状态
# ============================================================

