# ============================================================
# 004_seed_nodes.yaml —— 全景节点树定义（ECOCITY-26 生态城一期）
#
# 用法：
#   uv run python scripts/manage_nodes.py create --file emily-core/emily_core/infrastructure/database/scripts/004_seed_nodes.yaml --dry-run
#   uv run python scripts/manage_nodes.py create --file emily-core/emily_core/infrastructure/database/scripts/004_seed_nodes.yaml
#
# 说明：
#   - node_id 为业务编号，统一前缀 ECOC（ECOCITY缩写）
#   - stage_id: 0=立项 1=规划设计 2=工程施工 3=交付结算
#   - node_type: MILESTONE / WORK_PACKAGE / TASK
#   - owner_dept_id 和 related_company_id 用中文名称，batch 创建时会解析
#   - children 嵌套自动展平并设 parent_node_id
#   - deliverables 为节点需产出的成果清单
#   - dependencies 为前置依赖（按 deliverable_name 模糊匹配）
# ============================================================

project_id: "ECOCITY-26"
creator_id: "王建国"

nodes:
  # ═══════════════════════════════════════════════════════════
  # 立项阶段 (stage_id=0)
  # ═══════════════════════════════════════════════════════════
