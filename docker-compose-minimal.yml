# ── Emily 最小部署：仅 core + postgres ──
# 用法: docker compose -f docker-compose-minimal.yml up -d
# 需要 .env 中配置 EMILY_LLM_API_KEY

services:
  # ── 业务核心 ──
  emily-core:
    build:
      context: ./emily-core
      dockerfile: Dockerfile
    image: emily-core:latest
    container_name: emily-core
    restart: always
    ports:
      - "127.0.0.1:18080:18080"          # HTTP API（仅宿主机访问）
      - "0.0.0.0:18081:18081"            # 监控看板（局域网可访问）
    environment:
      - TZ=Asia/Shanghai
      - EMILY_DATABASE_URL=postgresql://emily:emily_secret_2026@emily-postgres:5432/emily
      - EMILY_LLM_API_KEY=${EMILY_LLM_API_KEY:-}
      - EMILY_LLM_BASE_URL=${EMILY_LLM_BASE_URL:-https://api.deepseek.com}
      - EMILY_LLM_MODEL=${EMILY_LLM_MODEL:-deepseek-v4-flash}
      # ── RAG 关闭（无 embed 服务）──
      - EMILY_KB_ENABLED=false
      # ── VLM OCR ──
      - EMILY_VLM_API_URL=${EMILY_VLM_API_URL:-https://api.siliconflow.cn/v1/chat/completions}
      - EMILY_VLM_API_KEY=${EMILY_VLM_API_KEY:-}
      - EMILY_VLM_MODEL=${EMILY_VLM_MODEL:-Qwen/Qwen3-VL-8B-Instruct}
      - EMILY_STORAGE_ROOT=/app/attachments
      - EMILY_HOOK_CONFIG_PATH=/app/config/hook_config.json
      - EMILY_SOP_REPOSITORY_DIR=/app/sops
      - EMILY_API_TOKEN=${EMILY_API_TOKEN:-}
      - NAPCAT_WEBUI_TOKEN=${NAPCAT_WEBUI_TOKEN:-}
    volumes:
      # ── 人类编辑（只读）──
      - ./emily-data/sops:/app/sops
      - ./emily-data/skills:/app/skills:ro
      - ./emily-data/prompts:/app/prompts:ro
      - ./emily-data/config:/app/config:ro
      - ./emily-data/baseknowledge:/app/baseknowledge:ro
      - ./emily-data/tools:/app/tools:ro
      - ./emily-data/db_seeds:/app/db_seeds:ro
      - ./emily-data/rules:/app/rules:ro
      # ── Core 写入，人类查阅 ──
      - ./emily-data/notebooks:/app/notebooks
      - ./emily-data/logs:/app/logs
      - ./emily-data/attachments:/app/attachments
      - ./emily-data/user_memory:/app/user_memory
      - ./emily-data/journal:/app/journal
      - ./emily-data/session_archives:/app/session_archives
      # ── 代码（只读）──
      - ./emily-core/emily_core:/app/emily_core:ro
      - ./emily-core/api:/app/api:ro
      - ./emily-core/static:/app/static:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - emily_network
    depends_on:
      - emily-postgres

  # ── 业务数据库（pgvector 扩展）──
  emily-postgres:
    image: pgvector/pgvector:pg16
    container_name: emily-postgres
    ports:
      - "127.0.0.1:25432:5432"
    environment:
      - POSTGRES_USER=emily
      - POSTGRES_PASSWORD=emily_secret_2026
      - POSTGRES_DB=emily
    volumes:
      - ./emily-data/postgres_data:/var/lib/postgresql/data
    networks:
      - emily_network
    restart: always

networks:
  emily_network:
    driver: bridge
