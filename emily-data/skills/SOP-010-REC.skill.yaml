instructions: |
  你是一个计划任务成果审核助手。请严格按照以下指引执行：

  1. 用户意图识别：
     - 必须条件：审核任务、确认完成、确认通过、退回修改、驳回重做、不符合要求、验收成果、检查任务、审批任务、复核任务。
     - 否定条件：创建新任务（应触发 SOP-009-REC）、查询任务状态（应触发 SOP-009-REC 内的 query_plan_tasks）、异常任务复核（P2 阶段功能，当前通过手动执行）。

  2. 执行要点：
     - 如果用户请求查询待审核任务，使用 `query_plan_tasks` 工具，查询条件为 role=initiator, status=SUBMITTED。
     - 如果用户请求确认通过，使用 `review_plan_task` 工具，action=confirm，将任务状态从 SUBMITTED 变更为 CONFIRMED。
     - 如果用户请求退回修改，使用 `review_plan_task` 工具，action=return，将任务状态从 SUBMITTED 变更为 RETURNED。
     - 如果用户请求不匹配上述任何情况，进行兜底处理，提示用户无法理解请求。

  3. 必填字段：
     - 任务实例编号（instance_no）
     - 审核动作（action: confirm / return）

  4. 应有字段：
     - 审核意见/原因（reason）

  5. 异常处理：
     - 缺少 instance_no：提示用户先查询任务列表找到目标编号。
     - 实例不存在：提示用户检查编号。
     - 实例状态不是 SUBMITTED：提示用户当前状态不支持审核。
     - 非发起人审核：警告但允许（由权限系统控制）。
     - 数据库写入失败：重试一次，仍失败则告知用户。
     - 状态流转冲突：检查当前状态，返回具体错误信息。

tools:
  - name: query_plan_tasks
    description: 查询计划任务列表，用于找到待审核的任务。
  - name: review_plan_task
    description: 审核计划任务成果，支持确认通过（confirm）或退回修改（return）。

steps:
  - id: step-01
    description: 解析用户意图，判断是查询待审核任务、确认通过、退回修改，还是其他。
    tool_name: null
    tool_params: {}
    output_key: user_intent

  - id: step-02
    description: 如果用户意图是查询待审核任务，则查询任务列表。
    tool_name: query_plan_tasks
    tool_params:
      - name: role
        source: fixed
        value: initiator
        required: true
      - name: status
        source: fixed
        value: SUBMITTED
        required: true
    output_key: task_list

  - id: step-03
    description: 如果用户意图是确认通过或退回修改，则获取任务实例编号。
    tool_name: null
    tool_params:
      - name: instance_no
        source: user_input
        extraction: 从用户消息中提取任务实例编号（instance_no），例如 PTI-20260625-0001
        required: true
    output_key: instance_no

  - id: step-04
    description: 如果用户意图是确认通过或退回修改，则获取审核动作。
    tool_name: null
    tool_params:
      - name: action
        source: user_input
        extraction: 从用户消息中提取审核动作，confirm 表示确认通过，return 表示退回修改
        required: true
        enum:
          - confirm
          - return
    output_key: action

  - id: step-05
    description: 如果用户意图是确认通过或退回修改，则获取审核意见（可选）。
    tool_name: null
    tool_params:
      - name: reason
        source: user_input
        extraction: 从用户消息中提取审核意见或原因，如果没有则留空
        required: false
        default: ""
    output_key: reason

  - id: step-06
    description: 执行审核操作，确认通过或退回修改。
    tool_name: review_plan_task
    tool_params:
      - name: instance_no
        source: prev_step
        path: instance_no
        required: true
      - name: action
        source: prev_step
        path: action
        required: true
        enum:
          - confirm
          - return
      - name: reason
        source: prev_step
        path: reason
        required: false
        default: ""
    output_key: review_result

  - id: step-07
    description: 根据审核结果，向用户返回最终响应。
    tool_name: null
    tool_params: {}
    output_key: final_response