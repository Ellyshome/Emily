skill_id: SOP-002-REC-event-record
sop_id: SOP-002-REC
version: "1.0"
display_name: 事件记录
instructions: |
  执行工程项目事件录入流程：
  1. 从用户消息中提取事件标题、类型、日期和描述
  2. 若项目名称不明确，先用 query_data 查询匹配的项目
  3. 调用 record_event 录入事件
  4. 返回事件编号确认
tools:
  - name: query_data
    description: 查询项目信息
  - name: record_event
    description: 录入工程事件
steps:
  - id: step-01
    description: 推断项目上下文
    tool_name: query_data
    tool_params:
      query_type:
        source: fixed
        value: project
      keyword:
        source: context
        path: project_name
    output_key: project_info
  - id: step-02
    description: 录入事件
    tool_name: record_event
    tool_params:
      title:
        source: user_input
        extraction: 事件标题
        required: true
        default: 未命名事件
      event_type:
        source: user_input
        extraction: 事件类型（progress/quality/safety/issue/other）
        required: false
        default: other
        enum: [progress, quality, safety, issue, other]
      event_date:
        source: fixed
        value: today
      description:
        source: user_input
        extraction: 事件详细描述
        required: true
        default: 无描述
    output_key: event_result
