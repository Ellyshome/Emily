instructions: |
  你是一个 AI Agent，负责处理用户发起的「待解决问题」相关请求。

  支持三种操作类型：
    1. 查看清单：列出所有待处理问题
    2. 记录新问题：将用户描述的问题添加到待解决清单
    3. 处理问题：将已有问题标记为已解决（需管理员权限）

  触发条件：用户消息包含 PND 编号、"查看待解决问题"、"记录一个待解决问题"、"列出待解决问题"、"有哪些待处理" 等语义，或管理员针对某个系统发现做出决策。

  异常处理：如果 PND 编号不存在，提示编号错误；如果非管理员调用 resolve，拒绝访问。

tools:
  - name: manage_pending_issues
    description: 待解决问题管理工具，支持 list_pending / add / resolve 三种操作
  - name: record_event
    description: 决策事件录入工具，用于在处理待解决问题时记录决策事件

steps:
  - id: step-01
    description: 判断用户意图，确认操作类型（list_pending / add / resolve）
    tool_name: null
    tool_params:
      - name: action
        source: user_input
        extraction: 从用户消息中推断操作类型。枚举值：list_pending（查看清单）、add（记录新问题）、resolve（处理已有问题）
        required: true
        enum:
          - list_pending
          - add
          - resolve
      - name: pnd_id
        source: user_input
        extraction: 从用户消息中提取 PND 编号（格式 PND-YYYYMMDD-NNNN），仅 resolve 时需要
        required: false
      - name: decision
        source: user_input
        extraction: 从用户消息中提取处理决策内容，仅 resolve 时需要
        required: false
    output_key: intent_result

  - id: step-02
    description: 如果操作类型为查看清单，调用 manage_pending_issues 工具列出所有待解决问题
    tool_name: manage_pending_issues
    tool_params:
      - name: action
        source: fixed
        value: list_pending
        required: true
    output_key: pending_list

  - id: step-03
    description: 如果操作类型为记录新问题，从用户消息中提取问题描述并添加到清单
    tool_name: manage_pending_issues
    tool_params:
      - name: action
        source: fixed
        value: add
        required: true
      - name: description
        source: user_input
        extraction: 从用户消息中提取待解决问题的详细描述
        required: true
      - name: source
        source: user_input
        extraction: 问题的来源或背景（如"用户通过对话添加"）
        required: false
    output_key: add_result

  - id: step-04
    description: 如果操作类型为处理问题，先调用 record_event 录入决策事件
    tool_name: record_event
    tool_params:
      - name: title
        source: user_input
        extraction: 从用户的决策内容中提炼事件标题，格式"待解决问题决策：XXX"
        required: true
      - name: event_type
        source: fixed
        value: decision
        required: false
      - name: description
        source: user_input
        extraction: 用户对待解决问题的决策内容
        required: true
    output_key: event_result

  - id: step-05
    description: 调用 manage_pending_issues 工具将待解决问题标记为已解决
    tool_name: manage_pending_issues
    tool_params:
      - name: action
        source: fixed
        value: resolve
        required: true
      - name: issue_id
        source: prev_step
        path: intent_result.pnd_id
        required: true
      - name: decision
        source: prev_step
        path: intent_result.decision
        required: true
    output_key: resolve_result

  - id: step-06
    description: 根据操作类型，向用户返回最终结果
    tool_name: null
    tool_params: {}
    output_key: final_response
