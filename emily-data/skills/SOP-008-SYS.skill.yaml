instructions: |
  你是一个 AI Agent，负责处理管理员发起的「待解决问题处理」请求。
  仅允许角色为 admin 的用户执行此流程。
  当用户消息包含 PND 编号（如 "PND-xxx"）、"查看待解决问题"、"列出待解决问题"、"有哪些待处理" 等语义，或管理员针对某个系统发现做出决策（如 "那个问题我决定..."、"这个不用管了"）时，应触发此业务流。
  如果用户不是管理员，或只是在讨论问题但没有做出决策，则不应触发。
  处理流程分为两种操作类型：
    1. 查看清单：调用 manage_pending_issues 工具，action 参数为 "list_pending"，然后简洁列出 PND 编号和问题简述。
    2. 处理问题：先调用 record_event 工具录入决策事件，再调用 manage_pending_issues 工具，action 参数为 "resolve"，最后确认已闭环并给出决策事件编号。
  异常处理：如果 PND 编号不存在，提示编号错误；如果非管理员调用，拒绝访问。

tools:
  - name: manage_pending_issues
    description: 待解决问题管理工具，用于查看清单或解决待处理问题。
  - name: record_event
    description: 决策事件录入工具，用于在处理待解决问题时记录决策事件。

steps:
  - id: step-01
    description: 判断用户意图，确认是否为待解决问题处理请求，并识别操作类型（查看清单或处理问题）。
    tool_name: null
    tool_params: {}
    output_key: intent_result

  - id: step-02
    description: 如果操作类型为查看清单，调用 manage_pending_issues 工具列出所有待解决问题。
    tool_name: manage_pending_issues
    tool_params:
      - name: action
        source: fixed
        value: list_pending
        required: true
    output_key: pending_issues_list

  - id: step-03
    description: 如果操作类型为处理问题，从用户输入中提取 PND 编号和决策内容。
    tool_name: null
    tool_params:
      - name: pnd_id
        source: user_input
        extraction: 从用户消息中提取 PND 编号，格式如 PND-YYYYMMDD-NNNN
        required: true
      - name: decision
        source: user_input
        extraction: 从用户消息中提取管理员对问题的决策内容
        required: true
    output_key: extracted_issue_info

  - id: step-04
    description: 调用 record_event 工具录入决策事件。
    tool_name: record_event
    tool_params:
      - name: pnd_id
        source: prev_step
        path: extracted_issue_info.pnd_id
        required: true
      - name: decision
        source: prev_step
        path: extracted_issue_info.decision
        required: true
    output_key: event_record_result

  - id: step-05
    description: 调用 manage_pending_issues 工具将待解决问题标记为已解决。
    tool_name: manage_pending_issues
    tool_params:
      - name: action
        source: fixed
        value: resolve
        required: true
      - name: pnd_id
        source: prev_step
        path: extracted_issue_info.pnd_id
        required: true
    output_key: resolve_result

  - id: step-06
    description: 根据操作类型，向用户返回最终结果。查看清单时列出 PND 编号和问题简述；处理问题时确认已闭环并给出决策事件编号。
    tool_name: null
    tool_params: {}
    output_key: final_response