instructions: |
  你是一个项目节点管理助手。你的职责是帮助用户管理全景节点（工作项），包括创建、查询、更新进度、添加依赖和挂载子节点。

  执行要点：
  1. 首先分析用户消息中的操作意图，从以下五种操作中识别：创建节点、查询节点、更新成果进度、添加前置依赖、挂载子节点。
  2. 从用户自然语言中提取必要的结构化参数，如节点编号、名称、截止时间、成果编号等。
  3. 执行操作前必须进行业务校验：
     - 检查节点是否存在
     - 检查用户权限是否足够（创建/更新/添加依赖/挂载子节点需要Level3权限，查询需要Level1权限）
     - 检查依赖是否合法（避免循环依赖）
     - 检查节点状态是否允许操作（成果上报必须来自已分配任务，任务必须挂载于执行中的全景节点；未启用或CONDITIONS_NOT_MET状态的节点不得挂载任何任务）
  4. 执行操作后，返回操作结果和当前状态信息，包括进度、流转情况以及受影响的祖先节点列表。
  5. 注意合规关联：成果上报必须来自已分配任务，任务必须挂载于执行中的全景节点。当任务挂载到非IN_PROGRESS状态的节点时，应阻断并引导用户联系有权限的负责人先启动节点。

  状态流转规则：
  - 节点创建 → CONDITIONS_NOT_MET（条件不足）
  - 添加成果 + 前置依赖满足 → IN_PROGRESS（进行中）
  - 所有必需成果100%完成 → COMPLETED（已完成·终态）
  - 阻塞场景：添加weight≥999的依赖 → 自动回退至CONDITIONS_NOT_MET

tools:
  - name: create_node
    description: 创建全景节点。用于在项目中创建一个新的工作项节点。
  - name: query_node
    description: 查询节点详情。用于获取指定节点的详细信息，包括状态、进度等。
  - name: update_node_progress
    description: 更新成果进度。用于更新某个成果的完成进度，并触发节点状态流转。
  - name: add_node_dependency
    description: 添加前置依赖。用于为节点添加前置依赖关系，包含循环检测。
  - name: mount_child_node
    description: 挂载父子节点关系。用于将一个节点挂载为另一个节点的子节点。

steps:
  - id: step-01
    description: 分析用户消息，识别操作意图（创建/查询/更新进度/添加依赖/挂载子节点）
    tool_name: null
    tool_params: {}
    output_key: intent

  - id: step-02
    description: 从用户消息中提取操作所需的参数
    tool_name: null
    tool_params:
      - name: node_id
        source: user_input
        extraction: 从用户消息中提取节点编号（如SG-001）
        required: true
      - name: node_name
        source: user_input
        extraction: 从用户消息中提取节点名称（如"景观施工图设计"）
        required: false
      - name: project_id
        source: context
        path: project_id
        required: false
      - name: deadline
        source: user_input
        extraction: 从用户消息中提取截止时间
        required: false
      - name: deliverable_id
        source: user_input
        extraction: 从用户消息中提取成果编号（如SG-001-DELV-001）
        required: false
      - name: current_amount
        source: user_input
        extraction: 从用户消息中提取进度百分比数值
        required: false
      - name: depends_on_deliverable_id
        source: user_input
        extraction: 从用户消息中提取前置依赖的成果编号
        required: false
      - name: parent_node_id
        source: user_input
        extraction: 从用户消息中提取父节点编号
        required: false
      - name: child_node_id
        source: user_input
        extraction: 从用户消息中提取子节点编号
        required: false
    output_key: extracted_params

  - id: step-03
    description: 根据意图执行对应的节点操作
    tool_name: null
    tool_params:
      - name: intent
        source: prev_step
        path: intent
        required: true
      - name: params
        source: prev_step
        path: extracted_params
        required: true
    output_key: operation_result

  - id: step-04
    description: 返回操作结果和当前状态信息
    tool_name: null
    tool_params:
      - name: success
        source: prev_step
        path: operation_result.success
        required: true
      - name: node_id
        source: prev_step
        path: operation_result.node_id
        required: true
      - name: status
        source: prev_step
        path: operation_result.status
        required: true
      - name: progress
        source: prev_step
        path: operation_result.progress
        required: true
      - name: message
        source: prev_step
        path: operation_result.message
        required: true
      - name: affected_ancestors
        source: prev_step
        path: operation_result.affected_ancestors
        required: false
    output_key: final_response