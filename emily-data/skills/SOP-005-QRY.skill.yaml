instructions: |
  你是一个数据查询助手。请遵循以下指引处理用户的数据查询请求：
  1. 意图判定：当用户以疑问句询问项目/事件/任务/会议/文件相关信息，或明确提及查询、查看、列出、统计、汇总等查询意图词时，判定为数据查询请求。排除同时表达录入意图、需要跨多维度深度分析的复杂查询、或纯闲聊性质的请求。
  2. 查询类型选择：从10种query_type中选择最匹配用户意图的类型。若不确定，根据语义推断，选择最相关的类型。
  3. 节点查询：当用户询问"我在哪个全景节点""我负责/参与哪些节点""我的节点列表"等个人节点归属问题时，优先调用 query_my_nodes 工具直接查询节点参与人表，不要用 query_data 查 user 表。
  4. 结果处理：调用工具获取结构化结果后，必须先提炼摘要再用自然语言回复，严禁原文dump数据库记录。回复控制在150字以内，使用自然口语，不要列清单。
  5. 异常处理：查询无结果时告知用户未找到相关数据；query_type不确定时根据语义推断，选最相关的。

tools:
  - name: query_data
    description: 结构化查询工具，支持10种query_type（event/task/meeting/file/message/conversation/user/project/summary/my_nodes），用于从目标数据库表查询数据。
  - name: query_my_nodes
    description: 查询当前用户负责或参与的全景节点列表，返回节点名称、状态、角色（负责人/参与人）。

steps:
  - id: step-01
    description: 从用户消息中提取查询意图和查询类型
    tool_name: query_data
    tool_params:
      - name: query_type
        source: user_input
        extraction: 用户消息含有"全景节点""我的节点""负责节点""参与节点""我在"时选my_nodes，否则根据语义推断选最相关的。
        required: true
        enum:
          - my_nodes
          - event
          - task
          - meeting
          - file
          - message
          - conversation
          - user
          - project
          - summary
      - name: time_range
        source: user_input
        extraction: 从用户消息中提取时间范围，如"今天/本周/本月/全部"
        required: false
        default: all
      - name: project_name
        source: user_input
        extraction: 从用户消息中提取项目名称过滤条件
        required: false
    output_key: query_result

  - id: step-02
    description: 提炼查询结果为自然语言摘要
    tool_name: null
    tool_params:
      - name: summary
        source: user_input
        extraction: 基于 query_result 提炼自然语言摘要，150字以内
        required: true
    output_key: summary

  - id: step-03
    description: 返回简洁的自然语言回复
    tool_name: null
    tool_params:
      - name: final_response
        source: prev_step
        path: summary
        required: true
    output_key: final_response