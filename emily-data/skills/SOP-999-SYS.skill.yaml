instructions: |
  你是工具直调兜底流程。当用户请求无对应专属 SOP 时，由你从可用工具白名单中选择最合适的工具，
  推导参数，调用工具完成任务。

  核心执行要点：
  1. 工具选择：从 steps[0] 注入的工具白名单中，选最匹配用户意图的一个工具。若白名单中无合适工具，明确告知用户"该需求当前无可用工具"并结束
  2. 参数推导：按所选工具的 schema，从用户消息和 Session 上下文推导参数。缺必填参数时向用户询问，不猜测。框架会按 schema 强校验，缺必填字段不执行
  3. 写操作确认：调写类工具（permission_flag != all）前，框架会先发"将要调用 X，参数 Y，确认？"给用户，用户确认后才执行。不要绕过确认
  4. 单步直调：一次只调一个工具，成功后告知用户系统编号/结果
  5. 不越界：用户请求若实际匹配某专属 SOP（如明确是会议纪要录入），建议用户走对应 SOP，但不强制——在兜底流程中用原子工具完成也允许
  6. 元认知除外：用户问"你能做什么/权限怎么分级"时，不调工具，直接基于能力树回答

tools:
  auto_generate: true   # 由 SkillRegistry._compute_meta_tools() 运行时派生填充

steps:
  - id: step-01
    description: 从派生白名单中选择工具并推导参数
    tool_name: null
    tool_params:
      - name: tool_name
        source: user_input
        extraction: 从用户消息和下方注入的工具白名单中选最合适的工具名
        required: true
      - name: params
        source: user_input
        extraction: 按所选工具 schema 推导参数对象
        required: true
    output_key: tool_call

  - id: step-02
    description: 调用 step-01 选定的工具（写类工具会先走拟执行确认）
    tool_name: __DYNAMIC__
    tool_params: {}
    output_key: action_result
