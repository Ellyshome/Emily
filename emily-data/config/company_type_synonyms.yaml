# 企业类型同义词表（人工维护）
#
# 用途：装配「参与单位」候选时做类型归一——企业台账的 type 是自由文本，写法不统一，
#       本表把各种写法归一到标准类型，再与模板声明里的 match.type_norm 做**等值**匹配。
#
# 维护约定：
#   · standard_types 必须与 company_info.type 的既有取值口径一致（不新增枚举，只收敛写法）
#   · synonyms 只做写法归一，不做语义推断（如「施工单位」不自动等同「总包」）
#   · 越出本表的企业类型视为「未归一」，在装配巡检中告警（不静默降级）
#
# 巡检：uv run python scripts/check_company_types.py

standard_types:
  - 建设单位
  - 设计单位
  - 总包
  - 分包
  - 监理
  - 供应商

synonyms:
  建设单位:
    - 建设单位
    - 业主
    - 甲方
    - 项目公司
    - 开发单位
    - 发包人
  设计单位:
    - 设计单位
    - 设计院
    - 设计
    - 勘察设计院
    - 设计公司
  总包:
    - 总包
    - 总承包
    - 总包单位
    - 总承包单位
    - 施工总承包
    - 工程总承包
    - EPC
  分包:
    - 分包
    - 分包单位
    - 专业分包
    - 劳务分包
    - 分包商
  监理:
    - 监理
    - 监理单位
    - 监理公司
    - 监理部
    - 监理咨询
  供应商:
    - 供应商
    - 供货商
    - 材料供应商
    - 设备供应商
    - 材料商
