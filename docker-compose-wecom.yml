services:
  # ── AstrBot 插件宿主（企业微信 wecom 适配器 + emily_agent 薄插件）──
  astrbot:
    image: soulter/astrbot:latest
    container_name: astrbot
    ports:
      - "6185:6185"              # Dashboard + 企微/微信客服统一 Webhook 回调（须公网可达）
      - "127.0.0.1:6199:6199"    # 独立 Webhook（备用）
    volumes:
      - ./data:/AstrBot/data          # emily_agent 插件 + AstrBot 配置 + 数据
    networks:
      - emily_network
    restart: always

  # ── Emily 业务核心 ──
  emily-core:
    build:
      context: ./emily-core
      dockerfile: Dockerfile
    image: emily-core:latest
    container_name: emily-core
    restart: always
    ports:
      - "127.0.0.1:18080:18080"       # HTTP API（仅本地）
    environment:
      - TZ=Asia/Shanghai
      - EMILY_DATABASE_URL=postgresql://emily:emily_secret_2026@emily-postgres:5432/emily
      - EMILY_LLM_API_KEY=${EMILY_LLM_API_KEY:-}
      - EMILY_LLM_BASE_URL=${EMILY_LLM_BASE_URL:-https://api.deepseek.com}
      - EMILY_LLM_MODEL=${EMILY_LLM_MODEL:-deepseek-v4-flash}
      # ── 模型分层与采样（emy-config 补入口；不设则取代码默认值）──
      - EMILY_LLM_ROUTER_MODEL=${EMILY_LLM_ROUTER_MODEL:-deepseek-v4-flash}
      - EMILY_LLM_GUARDIAN_MODEL=${EMILY_LLM_GUARDIAN_MODEL:-deepseek-v4-flash}
      - EMILY_LLM_AGENT_LOOP_MODEL=${EMILY_LLM_AGENT_LOOP_MODEL:-deepseek-v4-pro}
      - EMILY_EXPERT_MODEL=${EMILY_EXPERT_MODEL:-deepseek-chat}
      - EMILY_LLM_TEMPERATURE=${EMILY_LLM_TEMPERATURE:-0.1}
      - EMILY_LLM_MAX_TOKENS=${EMILY_LLM_MAX_TOKENS:-1024}
      - EMILY_LLM_AGENT_LOOP_MAX_TOKENS=${EMILY_LLM_AGENT_LOOP_MAX_TOKENS:-8192}
      - EMILY_LLM_CONTEXT_WINDOW_OVERRIDE=${EMILY_LLM_CONTEXT_WINDOW_OVERRIDE:-0}
      # ── 运行形态与日志（emy-config 补入口）──
      - EMILY_TAKEOVER_MODE=${EMILY_TAKEOVER_MODE:-monitor}
      - EMILY_BOT_NAME=${EMILY_BOT_NAME:-Emy}
      - EMILY_LOG_LEVEL=${EMILY_LOG_LEVEL:-INFO}
      - EMILY_SCHEDULER_ENABLED=${EMILY_SCHEDULER_ENABLED:-true}
      - EMILY_SESSION_ARCHIVE_ENABLED=${EMILY_SESSION_ARCHIVE_ENABLED:-true}
      # RAG (Embedding 后端：auto=本地优先+API兜底；local/remote 为显式指定)
      - EMILY_KB_ENABLED=true
      - EMILY_EMBEDDING_MODE=${EMILY_EMBEDDING_MODE:-auto}
      - EMILY_EMBEDDING_API_URL=${EMILY_EMBEDDING_API_URL:-https://api.siliconflow.cn/v1/embeddings}
      - EMILY_EMBEDDING_API_KEY=${SILICONFLOW_API_KEY:-}
      - EMILY_EMBEDDING_MODEL=${EMILY_EMBEDDING_MODEL:-BAAI/bge-m3}
      # VLM OCR
      - EMILY_VLM_API_URL=${EMILY_VLM_API_URL:-https://api.siliconflow.cn/v1/chat/completions}
      - EMILY_VLM_API_KEY=${SILICONFLOW_API_KEY:-}
      - EMILY_VLM_MODEL=${EMILY_VLM_MODEL:-Qwen/Qwen3-VL-8B-Instruct}
      - EMILY_STORAGE_ROOT=/app/attachments
      - EMILY_HOOK_CONFIG_PATH=/app/config/hook_config.json
      - EMILY_API_TOKEN=${EMILY_API_TOKEN:-}
      # 微信小程序渠道依赖的对外域名（已备案 HTTPS 域名，指向 wechat-gateway）
      - EMILY_WXMP_DOMAIN=${EMILY_WXMP_DOMAIN:-}
      # 邮箱渠道：SMTP 发信（启动报告自发）+ IMAP 收信（渠道连通性校验）
      - EMILY_EMAIL_IDKEY=${EMILY_EMAIL_IDKEY:-}
      - EMILY_EMAIL_PASSWORD=${EMILY_EMAIL_PASSWORD:-}
    volumes:
      # 配置写回（可写；emy-config 页面唯一可写的文件）
      - ./.env:/app/host/.env                               # 宿主机声明面；容器环境仍由 environment 段决定，不参与启动
      # 人类编辑（只读）
      - ./emily-data/sops:/app/sops
      - ./emily-data/skills:/app/skills:ro
      - ./emily-data/prompts:/app/prompts:ro
      - ./emily-data/config:/app/config:ro
      - ./emily-data/baseknowledge:/app/baseknowledge:ro
      - ./emily-data/tools:/app/tools:ro
      - ./emily-data/rules:/app/rules:ro
      # Core 写入
      - ./emily-data/notebooks:/app/notebooks
      - ./emily-data/logs:/app/logs
      - ./emily-data/attachments:/app/attachments
      - ./emily-data/user_memory:/app/user_memory
      - ./emily-data/journal:/app/journal
      - ./emily-data/session_archives:/app/session_archives
      - ./Issues/测试用例:/app/test_cases:ro                # 测试用例库（emy-console 只读展示）
      # 控制台运行期可改配置（渠道覆盖等）：/app/config 为只读，故单独读写挂载
      - ./emily-data/runtime:/app/runtime
      # 代码热更新
      - ./emily-core/emily_core:/app/emily_core:ro
      - ./emily-core/api:/app/api:ro
      - ./emily-core/static:/app/static:ro
    networks:
      - emily_network
    depends_on:
      - emily-postgres

  # ── PostgreSQL 16 + pgvector ──
  emily-postgres:
    image: pgvector/pgvector:pg16
    container_name: emily-postgres
    ports:
      - "127.0.0.1:25432:5432"
    environment:
      - POSTGRES_USER=emily
      - POSTGRES_PASSWORD=emily_secret_2026
      - POSTGRES_DB=emily
    volumes:
      - ./emily-data/postgres_data:/var/lib/postgresql/data
    networks:
      - emily_network
    restart: always

networks:
  emily_network:
    driver: bridge