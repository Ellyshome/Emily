services:
  napcat:                     # QQ 协议桥
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    ports:
      - "127.0.0.1:6098:6098"
      - "127.0.0.1:6099:6099"
    volumes:
      - ./emily-data/napcat_config:/app/napcat/config   # OneBot11/账号配置（可持久化）
      - ./emily-data/napcat_qq:/app/.config/QQ          # QQ 登录态与数据（重建容器不丢登录）
    networks:
      - emily_network
    restart: always

  astrbot:                    # 插件宿主（仅运行薄通信层插件 emily_agent）
    image: soulter/astrbot:latest
    container_name: astrbot
    ports:
      - "6185:6185"              # Dashboard + 企微/微信客服统一 Webhook 回调（须公网可达）
      - "127.0.0.1:6199:6199"    # 独立 Webhook（备用，未启用统一模式时才需要）
    volumes:
      - ./data:/AstrBot/data   # emily_agent 薄插件代码挂载
    networks:
      - emily_network
    depends_on:
      - napcat
    restart: always

  # ── Emily 业务核心独立容器（蓝图 §10.1）──
  emily-core:
    build:
      context: ./emily-core
      dockerfile: Dockerfile
    image: emily-core:latest
    container_name: emily-core
    # 显式入口：与 Dockerfile 的 CMD 一致；避免镜像层入口配置漂移导致容器空转
    entrypoint: ["python", "-m", "api.run"]
    restart: always
    ports:
      - "127.0.0.1:18080:18080"          # HTTP API（仅宿主机访问）
    environment:
      - TZ=Asia/Shanghai
      - EMILY_DATABASE_URL=postgresql://emily:emily_secret_2026@emily-postgres:5432/emily
      - EMILY_LLM_API_KEY=${EMILY_LLM_API_KEY:-}
      - EMILY_LLM_BASE_URL=${EMILY_LLM_BASE_URL:-https://api.deepseek.com}
      - EMILY_LLM_MODEL=${EMILY_LLM_MODEL:-deepseek-v4-flash}
      # ── 模型分层与采样（emy-config 补入口；不设则取代码默认值）──
      - EMILY_LLM_ROUTER_MODEL=${EMILY_LLM_ROUTER_MODEL:-deepseek-v4-flash}
      - EMILY_LLM_GUARDIAN_MODEL=${EMILY_LLM_GUARDIAN_MODEL:-deepseek-v4-flash}
      - EMILY_LLM_AGENT_LOOP_MODEL=${EMILY_LLM_AGENT_LOOP_MODEL:-deepseek-v4-pro}
      - EMILY_EXPERT_MODEL=${EMILY_EXPERT_MODEL:-deepseek-chat}
      - EMILY_LLM_TEMPERATURE=${EMILY_LLM_TEMPERATURE:-0.1}
      - EMILY_LLM_MAX_TOKENS=${EMILY_LLM_MAX_TOKENS:-1024}
      - EMILY_LLM_AGENT_LOOP_MAX_TOKENS=${EMILY_LLM_AGENT_LOOP_MAX_TOKENS:-8192}
      - EMILY_LLM_CONTEXT_WINDOW_OVERRIDE=${EMILY_LLM_CONTEXT_WINDOW_OVERRIDE:-0}
      # ── 运行形态与日志（emy-config 补入口）──
      - EMILY_TAKEOVER_MODE=${EMILY_TAKEOVER_MODE:-monitor}
      - EMILY_BOT_NAME=${EMILY_BOT_NAME:-Emy}
      - EMILY_LOG_LEVEL=${EMILY_LOG_LEVEL:-INFO}
      - EMILY_SCHEDULER_ENABLED=${EMILY_SCHEDULER_ENABLED:-true}
      - EMILY_SESSION_ARCHIVE_ENABLED=${EMILY_SESSION_ARCHIVE_ENABLED:-true}
      # ── RAG (pgvector + Embedding 后端) ──
      - EMILY_KB_ENABLED=true
      # 后端选择：auto（默认）= 本地 TEI 优先、不可用时回落远程 API；
      # local / remote 为显式指定（不兜底）。选型见 emily_core/infrastructure/embedding/factory.py
      - EMILY_EMBEDDING_MODE=${EMILY_EMBEDDING_MODE:-auto}
      # 本地 TEI 地址默认即 http://emily-embed:80（Config.tei_url），如需覆盖取消下行注释
      # EMILY_TEI_URL=http://emily-embed:80
      # ── 远程 SiliconFlow Embedding（auto 模式下作为本地不可用时的兜底）──
      - EMILY_EMBEDDING_API_URL=${EMILY_EMBEDDING_API_URL:-https://api.siliconflow.cn/v1/embeddings}
      - EMILY_EMBEDDING_API_KEY=${SILICONFLOW_API_KEY:-}
      - EMILY_EMBEDDING_MODEL=${EMILY_EMBEDDING_MODEL:-BAAI/bge-m3}
      # ── VLM OCR（共用 SiliconFlow Key）──
      - EMILY_VLM_API_URL=${EMILY_VLM_API_URL:-https://api.siliconflow.cn/v1/chat/completions}
      - EMILY_VLM_API_KEY=${SILICONFLOW_API_KEY:-}
      - EMILY_VLM_MODEL=${EMILY_VLM_MODEL:-Qwen/Qwen3-VL-8B-Instruct}
      - EMILY_STORAGE_ROOT=/app/attachments
      - EMILY_HOOK_CONFIG_PATH=/app/config/hook_config.json
      - EMILY_API_TOKEN=${EMILY_API_TOKEN:-}
      # 微信小程序渠道依赖的对外域名（已备案 HTTPS 域名，指向 wechat-gateway），
      # 供 emy-console「渠道连通性」探测 /health；不填则显示未配置
      - EMILY_WXMP_DOMAIN=${EMILY_WXMP_DOMAIN:-}
      # 邮箱渠道：SMTP 发信（启动报告自发）+ IMAP 收信（渠道连通性校验）
      - EMILY_EMAIL_IDKEY=${EMILY_EMAIL_IDKEY:-}
      - EMILY_EMAIL_PASSWORD=${EMILY_EMAIL_PASSWORD:-}
      # NAPCAT_WEBUI_TOKEN 现已动态从 NapCat 容器读取（docker/client.py _fetch_napcat_webui_token），
      # 不再依赖环境变量硬编码。保留此行仅当 Docker API 不可用时回退使用：
      - NAPCAT_WEBUI_TOKEN=${NAPCAT_WEBUI_TOKEN:-}
      # ── LLM 流量代理（mitmproxy）── 关闭时注释这 3 行 + 重启即可
      - HTTPS_PROXY=http://mitmproxy:8888
      - SSL_CERT_FILE=/app/certs/mitmproxy-ca-cert.pem
      - NO_PROXY=localhost,127.0.0.1,emily-postgres,emily-embed,mitmproxy
    volumes:
      # ── 配置写回（可写；emy-config 页面唯一可写的文件）──
      - ./.env:/app/host/.env                               # 宿主机声明面；容器环境仍由 environment 段决定，不参与启动
      # ── 人类编辑（只读）──
      - ./emily-data/sops:/app/sops
      - ./emily-data/skills:/app/skills:ro
      - ./emily-data/prompts:/app/prompts:ro
      - ./emily-data/config:/app/config:ro
      - ./emily-data/mitmproxy/mitmproxy-ca-cert.pem:/app/certs/mitmproxy-ca-cert.pem:ro
      - ./emily-data/baseknowledge:/app/baseknowledge:ro
      - ./emily-data/company_policies:/app/company_policies:ro
      - ./emily-data/tools:/app/tools:ro
      - ./emily-data/rules:/app/rules:ro
      # ── Core 写入，人类查阅 ──
      - ./emily-data/notebooks:/app/notebooks
      - ./emily-data/logs:/app/logs
      - ./emily-data/attachments:/app/attachments
      - ./emily-data/user_memory:/app/user_memory
      - ./emily-data/journal:/app/journal
      - ./emily-data/session_archives:/app/session_archives
      - ./Issues/测试用例:/app/test_cases:ro                # 测试用例库（emy-console 只读展示）
      # 控制台运行期可改配置（渠道覆盖等）：/app/config 为只读，故单独读写挂载
      - ./emily-data/runtime:/app/runtime
      # ── 代码（只读，开发阶段可热更新）──
      - ./emily-core/emily_core:/app/emily_core:ro
      - ./emily-core/api:/app/api:ro
      - ./emily-core/static:/app/static:ro
      - ./scripts:/app/scripts:ro                      # ScriptManager 执行目标（只读）
      - /var/run/docker.sock:/var/run/docker.sock:ro   # Docker API（容器状态查询）
    networks:
      - emily_network
    depends_on:
      - emily-postgres

  # ── 本地 TEI Embedding 服务（已停用，改用远程 SiliconFlow Embedding）──
  # 原因：emily-core 当前通过 EMILY_EMBEDDING_API_URL 走远程 SiliconFlow，本地 TEI 已停用；
  # 且 emily-data/hf_cache 中只有 HF 原始缓存（hub/models--BAAI--bge-m3），
  # 缺少 TEI 所需的扁平模型目录 /data/bge-m3-tei，导致容器反复以 exit 1 重启。
  # 如需恢复本地嵌入：先将 BGE-m3 转为 TEI safetensors 格式并放到 emily-data/hf_cache/bge-m3-tei，
  # 再取消注释下方服务定义，并把 emily-core 的 EMILY_TEI_URL 打开、远程 Embedding 注释掉。
  # 历史：cpu-1.5 曾因 HF 下载 bug 弃用 → 自写 transformers server（后随 docling-slim
  # 瘦身丢失 torch 崩溃）→ 2026-09 回归官方 TEI。注意必须 pin cpu-1.6：cpu-1.7 的
  # Candle 后端加载 BGE-m3 时段错误（exit 139），1.6 正常（batch 被限为 4）
  # emily-embed:
  #   image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
  #   container_name: emily-embed
  #   ports:
  #     - "127.0.0.1:8082:80"
  #   command:
  #     - --model-id
  #     - /data/bge-m3-tei
  #   environment:
  #     - HF_HUB_OFFLINE=1
  #     - HUGGINGFACE_HUB_OFFLINE=1
  #   volumes:
  #     - ./emily-data/hf_cache:/data:ro
  #   networks:
  #     - emily_network
  #   restart: always

  # ── MaxKB 已关闭（RAG 基座已替换为 pgvector + TEI）──

  emily-postgres:             # 业务数据库（Core 专用，pgvector 扩展）
    image: pgvector/pgvector:pg16
    container_name: emily-postgres
    ports:
      - "127.0.0.1:25432:5432"
    environment:
      - POSTGRES_USER=emily
      - POSTGRES_PASSWORD=emily_secret_2026
      - POSTGRES_DB=emily
    volumes:
      - ./emily-data/postgres_data:/var/lib/postgresql/data
    networks:
      - emily_network
    restart: always

  mitmproxy:                   # LLM 流量代理（抓包 emily-core ↔ DeepSeek）
    build:
      context: ./docker/mitmproxy
      dockerfile: Dockerfile
    image: emily-mitmproxy:latest
    container_name: mitmproxy
    environment:
      - LLM_TRACE_ENABLED=1           # 注释此行关闭 jsonl 落盘
    command:
      - --web-host
      - 0.0.0.0
      - --web-port
      - "8081"
      - --listen-host
      - 0.0.0.0
      - --listen-port
      - "8888"
      - --scripts
      - /app/trace_addon.py
      - --set
      - web_password=emily_proxy_2026
      - --set
      - view_filter=~d api.deepseek.com
    ports:
      - "127.0.0.1:8081:8081"   # mitmweb UI（仅宿主机访问，含明文 API key）
      - "127.0.0.1:8888:8888"   # 代理端口（容器间经 emily_network 访问）
    volumes:
      - ./emily-data/mitmproxy:/root/.mitmproxy
      - ./emily-data/logs:/app/logs       # jsonl 落盘目录（与 emily-core 共享）
    networks:
      - emily_network
    restart: always

  # ── 微信小程序网关（对外入口由宿主机 nginx 终止 TLS 后反代）──
  wechat-gateway:
    build:
      context: ./wechat-gateway
      dockerfile: Dockerfile
    image: wechat-gateway:latest
    container_name: wechat-gateway
    restart: always
    ports:
      - "127.0.0.1:18090:18090"          # 仅供宿主机 nginx 反代
    environment:
      - TZ=Asia/Shanghai
      - WXMP_CORE_URL=http://emily-core:18080
      - WXMP_REPLY_TIMEOUT=55
    volumes:
      - ./.env:/app/.env:ro              # core_client 从 /app/.env 读取 EMILY_API_TOKEN
    networks:
      - emily_network
    depends_on:
      - emily-core

networks:
  emily_network:
    driver: bridge
