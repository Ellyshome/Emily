services:
  napcat:                     # QQ 协议桥
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    ports:
      - "6098:6098"
      - "6099:6099"
    networks:
      - emily_network
    restart: always

  astrbot:                    # 插件宿主（仅运行薄通信层插件 emily_agent）
    image: soulter/astrbot:latest
    container_name: astrbot
    ports:
      - "6185:6185"
      - "6199:6199"
    volumes:
      - ./data:/AstrBot/data   # emily_agent 薄插件代码挂载
    networks:
      - emily_network
    depends_on:
      - napcat
    restart: always

  # ── Emily 业务核心独立容器（蓝图 §10.1）──
  emily-core:
    build:
      context: ./emily-core
      dockerfile: Dockerfile
    image: emily-core:latest
    container_name: emily-core
    restart: always
    ports:
      - "127.0.0.1:18080:18080"          # HTTP API（仅宿主机访问）
      - "0.0.0.0:18081:18081"            # 监控看板（局域网可访问）
    environment:
      - TZ=Asia/Shanghai
      - EMILY_DATABASE_URL=postgresql://emily:emily_secret_2026@emily-postgres:5432/emily
      - EMILY_LLM_API_KEY=${EMILY_LLM_API_KEY:-}
      - EMILY_LLM_BASE_URL=${EMILY_LLM_BASE_URL:-https://api.deepseek.com}
      - EMILY_LLM_MODEL=${EMILY_LLM_MODEL:-deepseek-chat}
      - EMILY_MAXKB_URL=http://maxkb:8080
      - EMILY_KB_ENABLED=true
      - EMILY_MAXKB_ADMIN_PASSWORD=maxkb123
      - EMILY_STORAGE_ROOT=/app/attachments
      - EMILY_HOOK_CONFIG_PATH=/app/config/hook_config.json
      - EMILY_SOP_REPOSITORY_DIR=/app/sops
      - EMILY_API_TOKEN=${EMILY_API_TOKEN:-}
      - EMILY_EMAIL_IDKEY=${EMILY_EMAIL_IDKEY:-}
      - EMILY_EMAIL_PASSWORD=${EMILY_EMAIL_PASSWORD:-}
      # NAPCAT_WEBUI_TOKEN 现已动态从 NapCat 容器读取（docker/client.py _fetch_napcat_webui_token），
      # 不再依赖环境变量硬编码。保留此行仅当 Docker API 不可用时回退使用：
      - NAPCAT_WEBUI_TOKEN=${NAPCAT_WEBUI_TOKEN:-}
      # ── LLM 流量代理（mitmproxy）── 关闭时注释这 3 行 + 重启即可
      - HTTPS_PROXY=http://mitmproxy:8888
      - SSL_CERT_FILE=/app/certs/mitmproxy-ca-cert.pem
      - NO_PROXY=localhost,127.0.0.1,emily-postgres,maxkb,mitmproxy
    volumes:
      # ── 人类编辑（只读）──
      - ./emily-data/sops:/app/sops
      - ./emily-data/skills:/app/skills:ro
      - ./emily-data/prompts:/app/prompts:ro
      - ./emily-data/config:/app/config:ro
      - ./emily-data/mitmproxy/mitmproxy-ca-cert.pem:/app/certs/mitmproxy-ca-cert.pem:ro
      - ./emily-data/baseknowledge:/app/baseknowledge:ro
      - ./emily-data/tools:/app/tools:ro
      - ./emily-data/db_seeds:/app/db_seeds:ro
      - ./emily-data/rules:/app/rules:ro
      # ── Core 写入，人类查阅 ──
      - ./emily-data/notebooks:/app/notebooks
      - ./emily-data/logs:/app/logs
      - ./emily-data/attachments:/app/attachments
      - ./emily-data/user_memory:/app/user_memory
      - ./emily-data/journal:/app/journal
      - ./emily-data/session_archives:/app/session_archives
      # ── 代码（只读，开发阶段可热更新）──
      - ./emily-core/emily_core:/app/emily_core:ro
      - ./emily-core/api:/app/api:ro
      - ./emily-core/static:/app/static:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # Docker API（容器状态查询）
    networks:
      - emily_network
    depends_on:
      - emily-postgres
      - maxkb

  maxkb:                      # RAG 知识库
    image: 1panel/maxkb:latest
    container_name: maxkb
    ports:
      - "8080:8080"
    environment:
      - MAXKB_EMBEDDING_MODEL_PATH=/opt/maxkb-app/model/embedding
      - MAXKB_EMBEDDING_MODEL_NAME=/opt/maxkb-app/model/embedding/Qwen3-Embedding-0.6B
    volumes:
      - D:\app\pgdata:/var/lib/postgresql/data
      - D:\app\Qwen\Qwen3-Embedding-0___6B:/opt/maxkb-app/model/embedding/Qwen3-Embedding-0.6B:ro
      - D:\app\Emily\emily-data\baseknowledge:/opt/maxkb-app/data/emily:ro
    networks:
      - emily_network
    restart: always

  emily-postgres:             # 业务数据库（Core 专用，干净空库）
    image: postgres:16-alpine
    container_name: emily-postgres
    ports:
      - "127.0.0.1:25432:5432"
    environment:
      - POSTGRES_USER=emily
      - POSTGRES_PASSWORD=emily_secret_2026
      - POSTGRES_DB=emily
    volumes:
      - D:\app\Emily\emily-data\db_seeds:/var/lib/postgresql/data
    networks:
      - emily_network
    restart: always

  mitmproxy:                   # LLM 流量代理（抓包 emily-core ↔ DeepSeek）
    build:
      context: ./docker/mitmproxy
      dockerfile: Dockerfile
    image: emily-mitmproxy:latest
    container_name: mitmproxy
    environment:
      - LLM_TRACE_ENABLED=1           # 注释此行关闭 jsonl 落盘
    command:
      - --web-host
      - 0.0.0.0
      - --web-port
      - "8081"
      - --listen-host
      - 0.0.0.0
      - --listen-port
      - "8888"
      - --scripts
      - /app/trace_addon.py
      - --set
      - web_password=emily_proxy_2026
      - --set
      - view_filter=~d api.deepseek.com
    ports:
      - "127.0.0.1:8081:8081"   # mitmweb UI（仅宿主机访问，含明文 API key）
      - "8888:8888"             # 代理端口（容器间访问）
    volumes:
      - ./emily-data/mitmproxy:/root/.mitmproxy
      - ./emily-data/logs:/app/logs       # jsonl 落盘目录（与 emily-core 共享）
    networks:
      - emily_network
    restart: always

networks:
  emily_network:
    driver: bridge
