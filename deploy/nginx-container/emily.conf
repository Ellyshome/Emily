# Emily 容器化反向代理（替代上游宿主机 nginx 方案）
#   /wxmp/*            → wechat-gateway:18090   微信小程序
#   /wecom/callback    → wechat-gateway:18090   企业微信应用回调
#   /console, /api/*   → emily-core:18080       控制台与 API（含 SSE）
#   /WW_verify_*.txt   → 静态校验文件
server {
    listen 80;
    server_name ellym.asia www.ellym.asia;

    location = /WW_verify_sNC6o6zdmQHulJWx.txt {
        root /var/www/verify;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ellym.asia www.ellym.asia;

    ssl_certificate     /ssl/cert.pem;
    ssl_certificate_key /ssl/cert.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 200m;

    location = /WW_verify_sNC6o6zdmQHulJWx.txt {
        root /var/www/verify;
        default_type text/plain;
    }

    # ── 企业微信应用回调（URL 验证 + 接收消息）──
    location = /wecom/callback {
        proxy_pass http://wechat-gateway:18090/wecom/callback;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── 微信小程序网关 ──
    location = /wxmp {
        return 301 /wxmp/;
    }

    location /wxmp/ {
        proxy_pass http://wechat-gateway:18090/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── 控制台与 API（SSE 需关闭缓冲）──
    location /console {
        proxy_pass http://emily-core:18080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://emily-core:18080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        default_type text/plain;
        return 200 "Emily gateway is running.\n";
    }
}
